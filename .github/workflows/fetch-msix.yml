name: fetch-claude-desktop-msix

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download MSIX
        shell: pwsh
        run: |
          $url = "https://claude.ai/api/desktop/win32/x64/msix/latest/redirect"
          Write-Host "Downloading from: $url"
          Invoke-WebRequest -Uri $url -MaximumRedirection 5 -OutFile "Claude.msix" -PassThru
          $size = (Get-Item "Claude.msix").Length
          Write-Host "Size: $size bytes"
          if ($size -lt 1000000) {
            Write-Host "ERROR: file too small, likely blocked"
            Get-Content "Claude.msix" -First 5
            exit 1
          }
          Write-Host "SUCCESS"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Claude Desktop MSIX"
          tag_name: "msix-v${{ github.run_number }}"
          files: Claude.msix
